databases:
  - name: posty-db
    plan: free
    databaseName: posty
    user: posty_user

services:
  - type: web
    name: posty-app
    env: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn myproject.wsgi:application"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: posty-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

