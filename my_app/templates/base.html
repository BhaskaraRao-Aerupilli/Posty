{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    {% block title %}
    {% endblock title %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
        <img src="{% static 'images/logo.png' %}" height="45px" width="45px" alt="LOGO" style="border-radius: 50%; border: 1px solid var(--gold); margin-right: 15px; object-fit: cover;">
        <span style="font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.4rem; font-weight: bold; letter-spacing: 2px;">POSTY</span>
    </a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" style="border-color: var(--gold);">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- Left side: Main Navigation -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0" style="margin-left: 20px;">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'display-post' %}active{% endif %}" href="{% url 'display-post' %}">Feed</a>
        </li>
      </ul>
      
      <!-- Right side: Authentication & Actions -->
      <ul class="navbar-nav ms-auto align-items-center gap-3">
        {% if request.user.is_authenticated %}
            <li class="nav-item d-none d-lg-block">
                <span style="color: var(--sand); font-style: italic; margin-right: 15px;">Welcome, {{ request.user.username }}</span>
            </li>
            <li class="nav-item">
                <a href="{% url 'add-post' %}" class="btn" style="background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 6px 16px; font-size: 0.9rem;">+ Write Post</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'logout' %}" class="btn btn-danger" style="padding: 6px 16px; font-size: 0.9rem;">Logout</a>
            </li>
        {% else %}
            <li class="nav-item">
                <a class="nav-link" href="{% url 'login' %}">Login</a>
            </li>
            <li class="nav-item">
                <a href="{% url 'register' %}" class="btn btn-primary" style="padding: 6px 16px; font-size: 0.9rem; color: black;">Sign Up</a>
            </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

    {% block content %}
    {% endblock content %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
